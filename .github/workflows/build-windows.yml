name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/build-windows.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements/build-windows.txt

      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements/windows.txt

      - name: Build Windows executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/build_windows.ps1 -OutputRoot .build/ci

      - name: Name checksum file for this platform
        shell: pwsh
        run: |
          Move-Item -Force `
            -LiteralPath ".build/ci/dist/SHA256SUMS.txt" `
            -Destination ".build/ci/dist/SHA256SUMS-windows.txt"

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Macast-RTX-Edition-Windows
          path: |
            .build/ci/dist/*.exe
            .build/ci/dist/SHA256SUMS-windows.txt
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem -LiteralPath ".build/ci/dist" -File |
            Where-Object { $_.Extension -eq ".exe" -or $_.Name -eq "SHA256SUMS-windows.txt" } |
            ForEach-Object { $_.FullName }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --generate-notes --title "Macast RTX Edition $tag"
          }
          gh release upload $tag $files --clobber
