name: Build macOS

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/build-macos.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements/build-macos.txt

      - name: Install mpv
        run: brew install mpv

      - name: Build macOS disk image
        env:
          PYTHON: python
        run: ./scripts/build_macos.sh

      - name: Upload disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Macast-RTX-Edition-macOS
          path: |
            .build/*/dist/*.dmg
            .build/*/dist/SHA256SUMS-macos.txt
          if-no-files-found: error
          include-hidden-files: true

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --generate-notes --title "Macast RTX Edition $tag"
          gh release upload "$tag" \
            .build/*/dist/*.dmg \
            .build/*/dist/SHA256SUMS-macos.txt \
            --clobber
